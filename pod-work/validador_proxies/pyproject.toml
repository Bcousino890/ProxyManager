[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "validador-proxies"
version = "0.1.0"
description = "Validador de proxies en formato host:puerto:usuario:clave"
authors = [{name = "Usuario", email = "usuario@example.com"}]
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/usuario/validador-proxies"